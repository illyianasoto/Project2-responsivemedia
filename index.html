<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <header>
        <div class="site-title">NYC Landmarks</div>
    </header>
<main>
    <h1>NYC Landmarks Virtual Tour</h1>
    <p class="intro">This site highlights some interesting landmarks across New York City's five boroughs.</p>

<!-- Featured image -->
<picture>
    <!-- Desktop -->
    <source
        media="(min-width: 645px)"
        srcset="images/AdobeStock_363209219.jpeg">

    <!-- Mobile -->
    <source
        media="(max-width: 644px)"
        srcset="images%20square/JPEG/AdobeStock_363209219.jpg">

    <!-- Fallback -->
    <img
        src="images/AdobeStock_363209219.jpg"
        alt="NYC pedestrian crossing signal">
</picture>

<div class="landmarks-grid">
<figure>
<img src="images square/JPEG/pexels-kelsey-caroline-774981359-19122990.jpg" alt="Coney Island Wonder Wheel">
</figure>
<figure>
<img src="images square/JPEG/pexels-loquellano-12404963.jpg" alt="Roosevelt Island Tram">
</figure>
<figure>
<img src="images square/JPEG/pexels-malcolmhill-12360516.jpg" alt="Yankee Stadium">
</figure>
<figure>
<img src="images square/JPEG/pexels-mora-versio-2150673251-34091093.jpg" alt="Statue of Liberty">
</figure>
<figure>
<img src="images square/JPEG/pexels-tracehudson-2424391.jpg" alt="Empire State Building">
</figure>
<figure>
<img src="images square/JPEG/praswin-prakashan-YOCN1a1m_dg-unsplash.jpg" alt="Staten Island Ferry">
</figure>

</div>

<!-- Responsive YouTube Video -->
<section class="landmark-video">
    <h2>Explore New York City</h2>

    <div class="videoWrapper ratio-16-9">
        <iframe
            src="https://www.youtube.com/embed/GmH42gAW0JQ"
            title="New York City Video"
            allowfullscreen>
        </iframe>
    </div>
</section>

    <footer>
    <p>Site by Illyiana Soto</p>
</footer>

</main>
</body>
</html>
